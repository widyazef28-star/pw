<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Render Tabel</title>
    <style>
        table {
            border-collapse: collapse;
            width: 300px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>

<h2>Data Tabel</h2>
<table id="tabel-data">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nama</th>
        </tr>
    </thead>
    <tbody>
        <!-- hasil render -->
    </tbody>
</table>

<script>
    // DATA (modular & scalable)
    const dataItems = [
        { id: 1, nama: "satu" },
        { id: 2, nama: "dua" },
        { id: 3, nama: "tiga" }
    ];

    // FUNCTION RENDER (DRY & reusable)
    function renderTable(data, targetId) {
        const tbody = document.querySelector(`#${targetId} tbody`);
        tbody.innerHTML = ""; // clear (biar bisa re-render)

        data.forEach(item => {
            const row = `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.nama}</td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    // INIT (modular entry point)
    renderTable(dataItems, "tabel-data");
</script>

</body>
</html>
